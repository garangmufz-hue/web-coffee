<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kopi Nusantara — Premium Coffee</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a0f0a;
            --bg-secondary: #261710;
            --bg-card: #2f1e16;
            --bg-elevated: #3d281e;
            --text-primary: #f5ede8;
            --text-secondary: #d4c5b8;
            --text-muted: #a48d7e;
            --gold: #c89b3c;
            --gold-light: #e8c97a;
            --gold-dark: #a87d2e;
            --accent-red: #b45a3a;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-light);
        }

        /* ===== UTILITY ===== */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section-label {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 8px;
            border-left: 3px solid var(--gold);
            padding-left: 14px;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .section-title span {
            color: var(--gold);
        }

        .section-sub {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 580px;
            line-height: 1.7;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: #1a0f0a;
            font-weight: 700;
            padding: 14px 36px;
            border-radius: 50px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font-sans);
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(200, 155, 60, 0.3);
        }
        .btn-primary i {
            font-size: 1.1rem;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font-sans);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ===== NAVIGATION ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 18px 0;
            background: rgba(26, 15, 10, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
        }
        nav.scrolled {
            background: rgba(26, 15, 10, 0.96);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--gold);
        }
        .logo small {
            font-family: var(--font-sans);
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--text-muted);
            display: block;
            margin-top: -4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            letter-spacing: 0.3px;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cart-btn {
            background: var(--gold);
            color: #1a0f0a;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-cart-btn:hover {
            transform: scale(1.05);
            background: var(--gold-light);
        }
        .nav-cart-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--accent-red);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: var(--transition);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: 120px 0 80px;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(200, 155, 60, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(180, 90, 58, 0.06) 0%, transparent 50%),
                var(--bg-primary);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(200, 155, 60, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-content .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200, 155, 60, 0.12);
            border: 1px solid rgba(200, 155, 60, 0.2);
            padding: 6px 18px 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold-light);
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }
        .hero-content .badge i {
            font-size: 0.7rem;
        }

        .hero-content h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 6vw, 4.6rem);
            font-weight: 700;
            line-height: 1.05;
            margin-bottom: 20px;
        }
        .hero-content h1 .highlight {
            color: var(--gold);
            position: relative;
        }
        .hero-content h1 .highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(200, 155, 60, 0.25);
            border-radius: 4px;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 460px;
            line-height: 1.8;
            margin-bottom: 36px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-bean-art {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1/1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bean-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(200, 155, 60, 0.08);
            animation: float 12s ease-in-out infinite;
        }
        .bean-circle:nth-child(1) {
            width: 100%;
            height: 100%;
            animation-delay: 0s;
            border-color: rgba(200, 155, 60, 0.05);
        }
        .bean-circle:nth-child(2) {
            width: 76%;
            height: 76%;
            animation-delay: -3s;
            border-color: rgba(200, 155, 60, 0.07);
        }
        .bean-circle:nth-child(3) {
            width: 52%;
            height: 52%;
            animation-delay: -6s;
            border-color: rgba(200, 155, 60, 0.1);
        }

        .bean-central {
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 40% 35%, #5a3a28, #2f1e16 70%);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 -20px 60px rgba(0, 0, 0, 0.4),
                inset 0 20px 40px rgba(200, 155, 60, 0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-glow 6s ease-in-out infinite;
        }
        .bean-central::after {
            content: '☕';
            font-size: 6rem;
            opacity: 0.15;
            position: absolute;
        }
        .bean-central .inner-glow {
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            background: radial-gradient(ellipse at 40% 30%, rgba(200, 155, 60, 0.06), transparent 70%);
        }

        .bean-float {
            position: absolute;
            font-size: 2.4rem;
            opacity: 0.15;
            animation: float-particle 18s ease-in-out infinite;
        }
        .bean-float:nth-child(4) {
            top: 0%;
            left: 5%;
            animation-delay: -2s;
            font-size: 2.8rem;
        }
        .bean-float:nth-child(5) {
            bottom: 0%;
            right: 2%;
            animation-delay: -7s;
            font-size: 3.2rem;
        }
        .bean-float:nth-child(6) {
            top: 30%;
            right: -8%;
            animation-delay: -12s;
            font-size: 1.8rem;
        }
        .bean-float:nth-child(7) {
            bottom: 25%;
            left: -6%;
            animation-delay: -4s;
            font-size: 2rem;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.02);
            }
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 -20px 60px rgba(0, 0, 0, 0.4);
            }
            50% {
                box-shadow: 0 40px 100px rgba(200, 155, 60, 0.08), inset 0 -20px 60px rgba(0, 0, 0, 0.4);
            }
        }
        @keyframes float-particle {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -20px) rotate(10deg);
            }
            50% {
                transform: translate(-5px, -10px) rotate(-5deg);
            }
            75% {
                transform: translate(15px, 5px) rotate(8deg);
            }
        }

        /* ===== PRODUCTS / GALLERY ===== */
        .products {
            padding: 100px 0 80px;
            background: var(--bg-secondary);
            position: relative;
        }
        .products::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 155, 60, 0.2), transparent);
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 56px;
        }
        .products-header .section-sub {
            max-width: 400px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(200, 155, 60, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .product-img {
            height: 220px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }
        .product-img .roast-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(26, 15, 10, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gold-light);
            border: 1px solid rgba(200, 155, 60, 0.15);
            letter-spacing: 0.5px;
        }
        .product-img .bean-icon {
            font-size: 5rem;
            opacity: 0.6;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
        }
        .product-img .bean-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(200, 155, 60, 0.06), transparent 70%);
        }

        .product-body {
            padding: 24px 24px 28px;
        }
        .product-body .product-name {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .product-body .product-origin {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .product-body .product-origin i {
            color: var(--gold);
            font-size: 0.7rem;
        }

        .cupping-notes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 16px;
        }
        .cupping-notes .note {
            background: rgba(200, 155, 60, 0.08);
            border: 1px solid rgba(200, 155, 60, 0.1);
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .cupping-notes .note i {
            margin-right: 4px;
            font-size: 0.6rem;
            color: var(--gold);
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .product-price {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .product-price small {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 2px;
        }
        .btn-add-cart {
            background: rgba(200, 155, 60, 0.12);
            border: 1px solid rgba(200, 155, 60, 0.2);
            color: var(--gold-light);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-sans);
        }
        .btn-add-cart:hover {
            background: var(--gold);
            color: #1a0f0a;
            border-color: var(--gold);
            transform: scale(1.02);
        }

        /* ===== CART PANEL ===== */
        .cart-overlay {
            position: fi
